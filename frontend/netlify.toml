[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_BACKEND_URL = "https://money-maker-cgp2.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://money-maker-cgp2.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

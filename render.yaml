services:
  - type: web
    name: trade-intelligence-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATA_PROVIDER
        value: "angel_one"
      - key: DEMO_MODE
        value: "false"
      - key: ANGEL_API_KEY
        value: "Y4bQd59O"
